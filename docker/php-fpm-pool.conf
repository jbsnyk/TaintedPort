[www]
user = www-data
group = www-data

listen = /var/run/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 200

; Forward only the Stripe secrets to workers, taken from the container's
; runtime environment (docker run -e ... / --env-file). Nothing is baked into
; the image. clear_env stays at its default, so nothing else leaks in.
env[STRIPE_SECRET_KEY] = $STRIPE_SECRET_KEY
env[STRIPE_WEBHOOK_SECRET] = $STRIPE_WEBHOOK_SECRET

; Jail every php file operation, including the intentional file:// LFI/SSRF,
; to the web root plus the temp/entropy paths the app needs. This blocks reads
; of /proc/self/environ (which would otherwise dump the Stripe secrets from the
; worker environment) and anything outside /var/www, while still allowing the
; documented jwt.php read that CHAIN-004 depends on.
php_admin_value[open_basedir] = /var/www/:/tmp/:/var/tmp/:/dev/urandom:/dev/null
